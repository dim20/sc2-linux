# WiFi credentials for wlan0.
#
# The vendor image makes /etc/wpa_supplicant/wpa_supplicant-wlan0.conf a
# symlink to this file, and the build keeps that arrangement. The published
# image ships this template with no network configured: add your own network
# block and keep the file mode 0600.
#
# To avoid writing the passphrase in clear text, generate the block with:
#
#     wpa_passphrase "YOUR_SSID" "YOUR_PASSPHRASE" >> /root/wpa_supplicant.conf
#
# and delete the commented-out psk= line it prints. Then:
#
#     systemctl restart wpa_supplicant@wlan0
#
# The interface is brought up by systemd-networkd (20-wlan0.network), and
# Ethernet remains the preferred default route.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

# network={
#     ssid="YOUR_SSID"
#     psk="YOUR_PASSPHRASE"
# }
